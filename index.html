<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة وكيلة المعلمات</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="app()" x-init="init()">

  <!-- ============================================================
       الشريط الجانبي — التنقل بين التبويبات
  ============================================================ -->
  <aside class="sidebar">
    <h2>🏫 لوحة الوكيلة</h2>
    <nav>
      <button @click="tab='teachers'"   :class="{active: tab==='teachers'}">👩‍🏫 المعلمات</button>
      <button @click="tab='attendance'" :class="{active: tab==='attendance'}">📋 الحضور</button>
      <button @click="tab='schedule'"   :class="{active: tab==='schedule'}">📅 الجدول</button>
      <button @click="tab='visits'"     :class="{active: tab==='visits'}">🔍 الزيارات الصفية</button>
      <button @click="tab='settings'"   :class="{active: tab==='settings'}">⚙️ الإعدادات</button>
    </nav>
  </aside>

  <!-- ============================================================
       المحتوى الرئيسي
  ============================================================ -->
  <main class="content">

    <!-- ============ تبويب: المعلمات ============ -->
    <template x-if="tab==='teachers'">
      <div>
        <h1>👩‍🏫 المعلمات</h1>

        <!-- البحث اللحظي -->
        <div class="search-bar">
          <input type="text"
                 x-model="query"
                 @input="liveSearch()"
                 placeholder="🔍 ابحث بالاسم أو التخصص أو الهاتف...">
        </div>

        <!-- شريط الأدوات -->
        <div class="toolbar">
          <button @click="showAddForm = !showAddForm">➕ إضافة معلمة</button>
          <button @click="importFile()">📥 استيراد CSV / JSON</button>
          <button @click="exportData()">📤 تصدير نسخة احتياطية</button>
        </div>

        <!-- نموذج الإضافة -->
        <template x-if="showAddForm">
          <div class="form-panel">
            <h3>إضافة معلمة جديدة</h3>
            <div class="form-grid">
              <label>الاسم الكامل
                <input type="text" x-model="newTeacher.name" required>
              </label>
              <label>التخصص
                <input type="text" x-model="newTeacher.specialty">
              </label>
              <label>رقم الهاتف
                <input type="text" x-model="newTeacher.phone">
              </label>
              <label>البريد الإلكتروني
                <input type="email" x-model="newTeacher.email">
              </label>
              <label>تاريخ التعيين
                <input type="date" x-model="newTeacher.hire_date">
              </label>
              <label>ملاحظات
                <input type="text" x-model="newTeacher.notes">
              </label>
            </div>
            <div class="form-actions">
              <button class="btn btn-success" @click="saveNewTeacher(newTeacher)">💾 حفظ</button>
              <button class="btn btn-secondary" @click="showAddForm=false">✖️ إلغاء</button>
            </div>
          </div>
        </template>

        <!-- جدول المعلمات -->
        <template x-if="filteredTeachers.length > 0">
          <table>
            <thead>
              <tr>
                <th>الاسم</th>
                <th>التخصص</th>
                <th>الهاتف</th>
                <th>البريد</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="t in filteredTeachers" :key="t.id">
                <tr>
                  <td x-text="t.name"></td>
                  <td x-text="t.specialty || '—'"></td>
                  <td x-text="t.phone || '—'"></td>
                  <td x-text="t.email || '—'"></td>
                  <td>
                    <button title="تعديل" @click="editTeacher(t)">✏️</button>
                    <button title="حذف" @click="deleteTeacher(t.id)">🗑️</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>

        <!-- حالة عدم وجود نتائج -->
        <template x-if="filteredTeachers.length === 0">
          <div class="empty">
            <p>لا توجد نتائج مطابقة</p>
          </div>
        </template>
      </div>
    </template>

    <!-- ============ تبويب: الحضور (مؤقت) ============ -->
    <template x-if="tab==='attendance'">
      <div>
        <h1>📋 الحضور والغياب</h1>
        <div class="empty">
          <p>سيتم إضافة وحدة تسجيل الحضور هنا</p>
        </div>
      </div>
    </template>

    <!-- ============ تبويب: الجدول (مؤقت) ============ -->
    <template x-if="tab==='schedule'">
      <div>
        <h1>📅 الجدول الدراسي</h1>
        <div class="empty">
          <p>سيتم إضافة بناء الجدول وتوزيع الحصص هنا</p>
        </div>
      </div>
    </template>

    <!-- ============ تبويب: الزيارات الصفية (مؤقت) ============ -->
    <template x-if="tab==='visits'">
      <div>
        <h1>🔍 الزيارات الصفية</h1>
        <div class="empty">
          <p>سيتم إضافة جدولة الزيارات ونماذج الملاحظات هنا</p>
        </div>
      </div>
    </template>

    <!-- ============ تبويب: الإعدادات ============ -->
    <template x-if="tab==='settings'">
      <div>
        <h1>⚙️ الإعدادات</h1>

        <!-- لوحة تخصيص الألوان -->
        <div class="settings-panel">
          <h3>🎨 تخصيص الألوان</h3>
          <label>
            <span>اللون الأساسي</span>
            <input type="color" x-model="theme.primary" @input="applyTheme()">
          </label>
          <label>
            <span>لون الخلفية</span>
            <input type="color" x-model="theme.bg" @input="applyTheme()">
          </label>
          <label>
            <span>لون النص</span>
            <input type="color" x-model="theme.text" @input="applyTheme()">
          </label>
          <label>
            <span>لون الشريط الجانبي</span>
            <input type="color" x-model="theme.sidebar" @input="applyTheme()">
          </label>
          <label>
            <span>لون نص الشريط الجانبي</span>
            <input type="color" x-model="theme.sidebarText" @input="applyTheme()">
          </label>

          <div style="margin-top:20px; display:flex; gap:10px;">
            <button @click="saveTheme()">💾 حفظ التخصيص</button>
            <button class="btn btn-secondary" @click="resetTheme()">🔄 استعادة الافتراضي</button>
          </div>
        </div>

        <!-- لوحة النسخ الاحتياطي -->
        <div class="settings-panel" style="margin-top:20px;">
          <h3>💾 النسخ الاحتياطي</h3>
          <div class="toolbar">
            <button @click="exportData()">📤 تصدير كل البيانات</button>
            <button @click="importBackup()">📥 استيراد نسخة احتياطية</button>
          </div>
        </div>
      </div>
    </template>

  </main>

  <!-- ============ رسالة التنبيه السفلية ============ -->
  <template x-if="toast">
    <div class="toast" x-text="toast"></div>
  </template>

  <!-- ============ Alpine.js App ============ -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
